<!doctype html>
<!--
  Chyron template: 编辑感下划线（B 风）
  黑字 cream 卡 + 关键词下黄色下划线 wipe-in。
  比黄底胶囊（chyron.html）更"编辑刊物"感，适合术语首次出现 / 强调点。

  ▶ 编辑：
    1. 替换 {{PREFIX}} {{KEYWORD}}（前缀文字 + 高亮关键词）
       例："Be" + "Humble" → "Be Humble"，划线只在 Humble 下面
       如果整句都要划线，把 prefix 留空、keyword 填整句
    2. 改 data-duration（推荐 1.0s — entrance 0.20 / underline 0.28 / hold / exit 0.18）

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  ⚠ 长文案保护（实战 cue 9/11 踩过坑，文案太长会横向溢出 canvas）
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  本模板 .text 是 `white-space: nowrap` 单行设计。字数硬上限：

    | 字号    | 中文最多 | 英文最多      | 例                             |
    |---------|----------|---------------|--------------------------------|
    | 130px   | **6 字** | **9-10 字符** | "底层好奇心" / "Be Humble"     |
    | 110px   | **8 字** | **12-14 字符**| "高级内功心法" / "Be Curious"  |
    |  96px   | **9-10 字** | **15-16 字符** | "100% 恐惧 0 期待"          |
    |  84px   | **12 字**| ~             | "在不确定中找到节奏"           |

    超出会从 .card 右边溢出（.wrap 加了 max-width: 920px 限位，但 .text 自身
    nowrap 会越过这个限位）。

  ⚠ 文案超 130px 6 字时，**不要再降字号** —— 拆 2 行更视觉清晰。
     2 行变体见下方注释片段（取消注释，删原 .text/.line 那块）。

  ▶ 2 行变体（带 2 个独立 underline）—— 文案 7+ 字时启用：

      <div class="wrap" id="cw">
        <div class="card">
          <div class="line">100% <span class="keyword">恐惧<span class="underline" id="ul1"></span></span></div>
          <br>
          <div class="line">0 <span class="keyword">期待<span class="underline" id="ul2"></span></span></div>
        </div>
      </div>

      CSS 调整：
        .line { font-size: 110px; line-height: 1.15; white-space: nowrap; }
        .line + .line { margin-top: 16px; }

      GSAP 时序：
        tl.to("#ul1", { scaleX: 1, duration: 0.30 }, 0.30);
        tl.to("#ul2", { scaleX: 1, duration: 0.30 }, 0.70);

  ▶ 多个 chyron 顺序出现时：保证 cue 之间有 ≥0.30s gap，避免字叠帧

  ▶ 渲染（timecut 单文件直渲，hyperframes 需 init 项目骨架）：
    npx --yes timecut index.html \
      --duration=<秒> --fps=30 --viewport=1080,1920 \
      --transparent-background --output=render.mov \
      --output-options="-c:v prores_ks -profile:v 4 -pix_fmt yuva444p10le" \
      --launch-arguments="--no-sandbox"
-->
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  :root {
    --canvas: #FAF6EF;
    --ink: #1A1A1C;
    --accent: #F2C94C;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1920px; overflow: hidden;
    background: transparent;
    font-family: "Inter", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
    color: var(--ink);
  }
  [data-composition-id="main"] { position: relative; width: 1080px; height: 1920px; }

  .wrap {
    position: absolute;
    left: 50%; top: 18%;
    transform: translate(-50%, 0);
    max-width: 920px;  /* ★ 安全边：canvas 1080 - 80×2 边距 = 920，超了就说明文案太长 */
    will-change: transform, opacity;
  }
  .card {
    /* 半透 cream 卡：0.55 让背景隐约透出，0.85+ 几乎不透；按内容明暗调 */
    background: rgba(250, 246, 239, 0.55);
    border-radius: 22px;
    padding: 28px 56px 36px 56px;
    box-shadow: 0 14px 36px rgba(26, 26, 28, 0.18);
    display: inline-block;
  }
  .text {
    font-size: 130px; font-weight: 900;   /* chyron 例外带上限 130 */
    color: var(--ink);
    letter-spacing: -0.02em;
    line-height: 1;
    white-space: nowrap;
    position: relative;
    display: inline-block;
  }
  .keyword {
    position: relative;
    display: inline-block;
  }
  .underline {
    position: absolute;
    left: -6px; right: -6px;
    bottom: -2px;
    height: 24px;
    background: var(--accent);
    border-radius: 4px;
    z-index: -1;
    transform: scaleX(0);
    transform-origin: left center;
    will-change: transform;
  }
</style>
</head>
<body>
<!-- ▶ 改 data-duration（推荐 1.0s） -->
<div id="root" data-composition-id="main"
     data-start="0" data-duration="1.0" data-width="1080" data-height="1920">
  <div class="wrap" id="cw">
    <div class="card">
      <!-- ▶ 替换 {{PREFIX}} 和 {{KEYWORD}}；prefix 可留空 -->
      <div class="text">{{PREFIX}} <span class="keyword">{{KEYWORD}}<span class="underline" id="ul"></span></span></div>
    </div>
  </div>
</div>

<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const total = 1.0;

tl.from("#cw", { opacity: 0, y: 20, scale: 0.95, duration: 0.20, ease: "power3.out" }, 0.0);
tl.to(  "#ul", { scaleX: 1, duration: 0.28, ease: "power2.out" }, 0.18);
tl.to(  "#cw", { opacity: 0, y: -16, duration: 0.18, ease: "power2.in" }, total - 0.18);

window.__timelines["main"] = tl;

window.addEventListener("load", function () {
  if (!window.__hyperframes_runtime) {
    tl.play();
  }
});
</script>
</body>
</html>
