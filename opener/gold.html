<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&family=Noto+Sans+SC:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ──────────────────────────────────────────────────────────────────
       * DEFAULT MODE: transparent overlay for talking-head video
       *  - bg = transparent (alpha)
       *  - text positioned in top-third (padding-top 280px) to clear face
       *  - heavier text-shadow so white/gold reads on busy backdrops
       *  - render with: timecut --transparent-background → ProRes 4444 mov
       *
       * For the legacy "card mode" (opaque gold radial bg, centered text,
       * standalone title scene without talking-head behind), see SKILL.md
       * → "Color variations" → opaque card snippet.
       * ────────────────────────────────────────────────────────────────── */

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
        font-family: "Noto Sans SC", "Inter", system-ui, sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      .scene-content {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 10px;
        /* padding-top: 280px —— 避开 iPhone Dynamic Island / 状态栏 / 平台顶部 UI 死区 (y<250)。
           SKILL.md 文档默认就是 280px；不要改回 100px (会被刘海切到)。 */
        padding: 280px 90px 0;
        z-index: 2;
      }

      .line {
        font-weight: 900;
        letter-spacing: -0.025em;
        line-height: 1.02;
        color: #ffffff;
        /* Heavier shadow than card mode — text overlays a live talking-head
           backdrop that may be light, dark, or busy. Triple shadow gives
           legibility across all of them. */
        text-shadow:
          0 4px 0 rgba(0,0,0,0.45),
          0 10px 28px rgba(0,0,0,0.7),
          0 0 50px rgba(0,0,0,0.5);
        will-change: transform, opacity;
      }
      /* Default sizes are tuned for 3-6 character Chinese lines or 2-3 word English lines.
         If your text overflows the 900px content width, drop the size by 10–20%.        */
      .line.l1 { font-size: 168px; }
      .line.l2 { font-size: 168px; margin-bottom: 8px; }

      .keyword-wrap {
        position: relative;
        display: inline-block;
        line-height: 0.95;
        padding: 8px 0 18px;
      }

      .keyword {
        font-weight: 900;
        font-size: 210px;
        letter-spacing: -0.02em;
        line-height: 0.95;
        white-space: nowrap;
        /* The 6-stop gradient is what sells the metallic look —
           a flat 2-stop gradient reads as plastic instead of metal. */
        background: linear-gradient(
          180deg,
          #6e5a1f 0%,
          #b89a3e 18%,
          #f5e6a8 42%,
          #d8b95a 58%,
          #8a722a 82%,
          #5a4715 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        filter: drop-shadow(0 6px 0 rgba(0,0,0,0.3)) drop-shadow(0 14px 26px rgba(40,28,5,0.65));
        clip-path: inset(0 100% 0 0);
        will-change: clip-path, transform;
      }

      /* Diagonal white shimmer that crosses the keyword after the wipe completes. */
      .shine {
        position: absolute;
        top: 0; left: 0;
        width: 60%;
        height: 100%;
        background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.85) 50%, transparent 70%);
        mix-blend-mode: screen;
        transform: translateX(-120%);
        pointer-events: none;
        z-index: 3;
        filter: blur(2px);
      }

      .eyebrow {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.92);
        text-shadow:
          0 2px 8px rgba(0,0,0,0.6),
          0 0 20px rgba(0,0,0,0.4);
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4.5"
      data-width="1080"
      data-height="1920"
    >
      <div class="scene-content">
        <div id="eyebrow" class="eyebrow">{{EYEBROW}}</div>
        <div id="line1" class="line l1">{{LINE1}}</div>
        <div id="line2" class="line l2">{{LINE2}}</div>
        <div class="keyword-wrap">
          <div id="keyword" class="keyword">{{KEYWORD}}</div>
          <div id="shine" class="shine"></div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#eyebrow", { y: 24, opacity: 0, duration: 0.45, ease: "power3.out" }, 0.10);
      tl.from("#line1",   { y: 70, opacity: 0, duration: 0.55, ease: "back.out(1.4)" }, 0.22);
      tl.from("#line2",   { y: 70, opacity: 0, duration: 0.55, ease: "back.out(1.4)" }, 0.42);

      // Keyword reveals via a clip-path wipe + scale-up.
      // skewX is set in BOTH from and to so GSAP keeps it across the tween — without
      // this, GSAP rewrites the transform property and the slant disappears.
      tl.fromTo("#keyword",
        { scale: 0.86, y: 30, opacity: 0, skewX: -6, clipPath: "inset(0 100% 0 0)" },
        { scale: 1, y: 0, opacity: 1, skewX: -6, clipPath: "inset(0 0% 0 0)",
          duration: 0.85, ease: "expo.out" },
        0.78);

      tl.fromTo("#shine",
        { x: "-120%" },
        { x: "260%", duration: 0.85, ease: "power2.inOut" },
        1.55);

      tl.to("#keyword", {
        scale: 1.015, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 1
      }, 1.7);

      window.__timelines["main"] = tl;

      // Auto-play when not running inside the HyperFrames runtime —
      // so timecut / direct-browser preview both work without manual trigger.
      window.addEventListener("load", function () {
        if (!window.__hyperframes_runtime) {
          tl.play();
        }
      });
    </script>
  </body>
</html>
