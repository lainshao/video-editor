<!doctype html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&family=Noto+Sans+SC:wght@800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  :root {
    --ink: #1A1A1C;
    --accent: #F2C94C;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1920px; overflow: hidden;
    background: transparent;
    font-family: "Noto Sans SC", "Inter", "PingFang SC", system-ui, sans-serif;
  }
  [data-composition-id="main"] { position: relative; width: 1080px; height: 1920px; }

  .wrap {
    position: absolute;
    left: 50%; top: 14%;
    transform: translate(-50%, 0);
    will-change: transform, opacity;
    text-align: center;
  }
  .text {
    font-size: 110px; font-weight: 900;
    color: #ffffff;
    letter-spacing: -0.025em;
    line-height: 1;
    white-space: nowrap;
    position: relative;
    display: inline-block;
    text-shadow:
      0 4px 0 rgba(0,0,0,0.5),
      0 10px 28px rgba(0,0,0,0.75),
      0 0 50px rgba(0,0,0,0.55);
  }
  .keyword {
    position: relative;
    display: inline-block;
  }
  .underline {
    position: absolute;
    left: -6px; right: -6px;
    bottom: -10px;
    height: 18px;
    background: var(--accent);
    border-radius: 4px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    transform: scaleX(0);
    transform-origin: left center;
    will-change: transform;
  }
</style>
</head>
<body>
<div id="root" data-composition-id="main"
     data-start="0" data-duration="3.5" data-width="1080" data-height="1920">
  <div class="wrap" id="cw">
    <div class="text">清迈 <span class="keyword">古城必去<span class="underline" id="ul"></span></span></div>
  </div>
</div>

<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const total = 3.5;

tl.from("#cw", { opacity: 0, y: 20, scale: 0.96, duration: 0.22, ease: "power3.out" }, 0.0);
tl.to(  "#ul", { scaleX: 1, duration: 0.32, ease: "power2.out" }, 0.20);
tl.to(  "#cw", { opacity: 0, y: -16, duration: 0.22, ease: "power2.in" }, total - 0.22);

window.__timelines["main"] = tl;

window.addEventListener("load", function () {
  if (!window.__hyperframes_runtime) tl.play();
});
</script>
</body>
</html>
