<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,800;0,900;1,700&family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ───────────────────────────────────────────────────────────────
       * 黄字衬线标题卡（通用 9:16 口播片头）
       *  黄色加粗衬线大标题 + 白色斜体副标题（默认不带 logo）
       *  透明叠层，叠在 9:16 talking head 上方 (top-third)
       *  渲染：见 SKILL.md 渲染章节——Node 25 用逐帧 poll-kill，
       *        不要用 timecut（Node 25 下会挂）。
       *  占位符：泰国 10 天 新手抄作业 完整路线 + 避坑
       *  ▶ 想加品牌 logo：见下方注释掉的 .logo 规则。
       * ─────────────────────────────────────────────────────────────── */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: transparent; }

      .scene-content {
        position: relative; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center;
        justify-content: flex-start;
        padding: 200px 80px 0;   /* top 200px 避开刘海死区 (y<250) */
        z-index: 2;
      }

      /* 顶部 logo 默认不放。需要时取消下面注释、在 .scene-content 顶部加一个 <div class="logo">…</div>：
       * .logo {
       *   width: 150px; height: 150px; border-radius: 30px;
       *   background: #cc6b49;
       *   display: flex; align-items: center; justify-content: center;
       *   box-shadow: 0 10px 30px rgba(0,0,0,0.35);
       *   margin-bottom: 40px;
       *   will-change: transform, opacity;
       * }
       * .logo svg { width: 88px; height: 88px; }
       */

      /* 黄色衬线大标题 */
      .title {
        font-family: "Playfair Display", "Noto Serif SC", serif;
        font-weight: 900; color: #ffd12e; text-align: center;
        line-height: 1.04; letter-spacing: -0.01em;
        text-shadow: 0 4px 0 rgba(0,0,0,0.40), 0 10px 28px rgba(0,0,0,0.65);
      }
      /* 字号按「Claude Code」+「到底怎么用？」调校；换长文案见 SKILL.md 调字号 */
      .title .t1 { font-size: 138px; will-change: transform, opacity; }
      .title .t2 { font-size: 138px; will-change: transform, opacity; }

      /* 白色斜体副标题（中文用 skewX 仿斜体，不用 font-style:italic） */
      .sub {
        margin-top: 28px;
        font-family: "Noto Sans SC", system-ui, sans-serif;
        font-weight: 700; font-size: 56px; color: #ffffff; text-align: center;
        transform: skewX(-8deg);
        text-shadow: 0 3px 10px rgba(0,0,0,0.7), 0 0 24px rgba(0,0,0,0.45);
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.5" data-width="1080" data-height="1920">
      <div class="scene-content">
        <!-- 顶部留给 logo 的位置：默认不放任何标记。需要时在这里加一个 <div class="logo">…</div>（样式见下方注释掉的 .logo 规则）。 -->

        <div class="title">
          <div id="t1" class="t1">泰国 10 天</div>
          <div id="t2" class="t2">新手抄作业</div>
        </div>

        <div id="sub" class="sub">完整路线 + 避坑</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.from("#t1",   { y: 60, opacity: 0, duration: 0.55, ease: "back.out(1.4)" }, 0.40);
      tl.from("#t2",   { y: 60, opacity: 0, duration: 0.55, ease: "back.out(1.4)" }, 0.62);
      tl.from("#sub",  { y: 30, opacity: 0, duration: 0.5,  ease: "power3.out" }, 0.95);
      tl.to(".title",  { scale: 1.015, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.4);
      tl.to(".scene-content", { opacity: 0, duration: 0.45, ease: "power2.in" }, 4.05);  // 结尾淡出

      window.__timelines["main"] = tl;
      // 自动播放（浏览器/HyperFrames 预览）；逐帧渲染时用 ?t= 同步 seek
      window.addEventListener("load", function () {
        if (window.__hyperframes_runtime) return;
        var p = new URLSearchParams(location.search);
        if (p.has("t")) { tl.pause(); tl.time(parseFloat(p.get("t"))); }
        else { tl.play(); }
      });
    </script>
  </body>
</html>
